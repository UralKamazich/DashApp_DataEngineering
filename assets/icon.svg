<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DataAnalize</title>
  <desc id="desc">A dark analytics dashboard with bars and a rising data line.</desc>
  <defs>
    <linearGradient id="background" x1="150" y1="110" x2="860" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252b38"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="280" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65d7ff"/>
      <stop offset="1" stop-color="#3977f6"/>
    </linearGradient>
    <linearGradient id="line" x1="250" y1="690" x2="790" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#49e3bd"/>
      <stop offset="1" stop-color="#78f29a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#05070a" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="150" y="168" width="724" height="688" rx="88" fill="#202631" stroke="#3b4556" stroke-width="10"/>

  <g fill="none" stroke="#596578" stroke-width="8" stroke-linecap="round" opacity=".32">
    <path d="M232 320H792"/>
    <path d="M232 476H792"/>
    <path d="M232 632H792"/>
    <path d="M232 788H792"/>
  </g>

  <g fill="url(#bar)">
    <rect x="254" y="596" width="92" height="192" rx="28" opacity=".78"/>
    <rect x="466" y="470" width="92" height="318" rx="28" opacity=".9"/>
    <rect x="678" y="300" width="92" height="488" rx="28"/>
  </g>

  <path d="M280 648L502 512L724 350" fill="none" stroke="#0a1115" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
  <path d="M280 648L502 512L724 350" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#eafff8" stroke="#42d9b1" stroke-width="14">
    <circle cx="280" cy="648" r="28"/>
    <circle cx="502" cy="512" r="28"/>
    <circle cx="724" cy="350" r="28"/>
  </g>
</svg>
